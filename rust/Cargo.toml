[package]
name = "pivsetup"
version = "0.1.0"
edition = "2021"
description = "Setup frontend for the experimental dm-piv paired native block views"
license = "GPL-2.0-only"
publish = false

[[bin]]
name = "pivsetup"
path = "src/main.rs"

[dependencies]
libc = "0.2"
zeroize = "1"
scrypt = { version = "0.11", default-features = false }
argon2 = { version = "0.5", default-features = false, features = ["alloc", "zeroize"] }

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
