[package]
name = "pivsetup"
version = "0.1.0"
edition = "2021"
description = "Setup frontend for the experimental dm-piv paired native block views"
license = "GPL-2.0-only"
publish = false

[[bin]]
name = "pivsetup"
path = "src/main.rs"

[dependencies]
libc = "0.2"
zeroize = "1"
argon2 = { version = "0.6", default-features = false, features = ["alloc", "zeroize", "parallel"] }
# Already required by argon2's `parallel` feature; used directly for a
# private 4-thread pool (src/blocks.rs, passphrase_kek).
rayon = "1"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

[features]
# PIVSETUP_TEST_* hooks (src/hooks.rs) for the guest test build only.
test-hooks = []
