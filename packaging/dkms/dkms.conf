# DKMS configuration for the out-of-tree dm-piv module (research prototype).
# packaging/install.sh dkms copies this file and the module sources from
# kernel/ into /usr/src/dm-piv-<version>/ and runs dkms add/build/install.
PACKAGE_NAME="dm-piv"
PACKAGE_VERSION="#VERSION#"
BUILT_MODULE_NAME[0]="dm-piv"
DEST_MODULE_LOCATION[0]="/updates/dkms"
MAKE[0]="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build modules"
CLEAN="make -C ${kernel_source_dir} M=${dkms_tree}/${PACKAGE_NAME}/${PACKAGE_VERSION}/build clean"
# Rebuild for every newly installed kernel. Never force-load a module built
# for another kernel.
AUTOINSTALL="yes"
